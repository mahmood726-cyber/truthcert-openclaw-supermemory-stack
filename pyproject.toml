[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthcert-openclaw-supermemory-stack"
version = "1.0.0"
description = "Fail-closed certifier with local-first memory for research synthesis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TruthCert Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
    "click>=8.1.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
otel = [
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
]

[project.scripts]
tc = "cli.tc:cli"
truthcertd = "certifier.main:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["certifier*", "memory*", "cli*", "ingest*", "renderer*", "gateway*", "worker*", "observability*"]

[tool.pytest.ini_options]
testpaths = ["tests", "memory/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
